services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-account_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-account_manager}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-account_manager}"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-account_manager}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-account_manager}?schema=public
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
    ports:
      - "${PORT:-3000}:3000"

  cron:
    # Replaces Vercel Cron — hits /api/cron/tick every CRON_INTERVAL seconds.
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
      CRON_INTERVAL: ${CRON_INTERVAL:-3600}
      APP_URL: http://app:3000
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        echo "cron: pinging $$APP_URL/api/cron/tick every $$CRON_INTERVAL s"
        while true; do
          sleep "$$CRON_INTERVAL"
          curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" "$$APP_URL/api/cron/tick" \
            || echo "cron: tick failed at $$(date -Iseconds)"
        done

volumes:
  db_data:
